name: test

on:
  push:
  pull_request:

jobs:
  tools:
    # 24.04: Python 3.9, the oldest version the tools support, is not available on newer images
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: make test
